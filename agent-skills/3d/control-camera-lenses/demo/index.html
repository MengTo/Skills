<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The focus plane</title><style>*{box-sizing:border-box}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;color:#f5f0de;background:#252d24;font:15px system-ui,sans-serif}canvas{display:block;width:100%;height:100%}header,form{position:absolute;left:4vw;text-shadow:0 1px 8px #171d17}header{top:6vh}h1{font:500 clamp(22px,3vw,40px)/1.03 Georgia,serif;margin:0}.control{display:flex;align-items:center;gap:12px}form{bottom:6vh;display:grid;gap:12px;padding:15px 18px;border-radius:9px;background:#182319ed}input{accent-color:#e9c689}button,select{font:inherit;background:#f4eddc;color:#1b241b;border:0;padding:6px 11px;border-radius:4px}output{font-variant-numeric:tabular-nums}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head><body><main><canvas aria-label="Red maple leaves across several distances show how lens, aperture and focus change the image"></canvas><header><h1>The focus plane</h1></header><form onsubmit="return false"><label class="control">Lens <select id="mm"><option>24</option><option selected>35</option><option>58</option><option>85</option></select> mm</label><label class="control">Focus <input id="depth" type="range" min="0.65" max="4.60" step="0.05" value="1.15"><output id="readout">1.15 m</output></label><label class="control">Aperture <select id="ap"><option value="1.4">ƒ/1.4</option><option value="4">ƒ/4</option><option value="11">ƒ/11</option></select></label></form></main><script src="assets/three.min.js"></script><script src="assets/lens.js"></script><script src="study.js"></script></body></html>
