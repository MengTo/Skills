<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Window light study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#25322c;color:#fff8e7;font:16px -apple-system,BlinkMacSystemFont,sans-serif}
main{height:100svh;min-height:360px;position:relative;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}
header{position:absolute;left:5vw;top:5vh;pointer-events:none;text-shadow:0 2px 20px #18261c}h1{margin:0;font:normal clamp(36px,5.6vw,76px)/1 Georgia,serif;letter-spacing:-.055em}
label{display:flex;align-items:center;gap:18px;position:absolute;left:5vw;bottom:7vh;padding:13px 19px;background:#16241dda;border:1px solid #b9b88c66;border-radius:100px;font-size:14px}input{accent-color:#d6bb8a;width:clamp(100px,15vw,200px)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><canvas aria-hidden="true"></canvas><header><h1>Window light</h1></header><label>Blind opening <input aria-label="Blind opening" type="range" min="0" max="100" value="59"></label></main>
<script src="assets/three.min.js"></script><script>
const T=THREE,canvas=document.querySelector('canvas'),container=document.querySelector('main'),slider=document.querySelector('input');
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color(0xa8bdab);
const camera=new T.PerspectiveCamera(42,1,.1,32);camera.position.set(3.35,2.84,5.42);camera.lookAt(-.25,1.63,-1.35);
const mat=(c,roughness=.6,metalness=0)=>new T.MeshStandardMaterial({color:c,roughness,metalness});
function box(w,h,d,m,x,y,z,parent=scene){const mesh=new T.Mesh(new T.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=mesh.receiveShadow=true;parent.add(mesh);return mesh;}
function cylinder(rt,rb,h,m,x,y,z){const mesh=new T.Mesh(new T.CylinderGeometry(rt,rb,h,40),m);mesh.position.set(x,y,z);mesh.receiveShadow=mesh.castShadow=true;scene.add(mesh);return mesh;}
let seed=1987;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
function wood(){const c=document.createElement('canvas');c.width=1024;c.height=256;const g=c.getContext('2d');g.fillStyle='#a7754f';g.fillRect(0,0,c.width,c.height);
 for(let i=0;i<1700;i++){const y=rand()*256,x=rand()*1100-80,w=18+rand()*460;g.strokeStyle=rand()<.51?'rgba(66,32,17,.15)':'rgba(231,182,118,.19)';g.lineWidth=.25+rand();g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+w*.28,y-2,x+w*.6,y+4,x+w,y);g.stroke();}
 const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}
const walnut=new T.MeshStandardMaterial({map:wood(),roughness:.43}),paint=mat(0x39564c,.89),floor=mat(0x685947,.82),trim=mat(0x6e5945),steel=mat(0x272e30,.38,.55),keys=mat(0x4b5251,.55);
box(12,.12,12,mat(0xb5ab8e,.95),0,4.52,0);box(12,.12,12,floor,0,-.09,0);box(10,4.8,.15,paint,0,2.34,-3.8);
// Aperture at x=-3.3 spans y=[1.05,3.8], z=[-3.1,1.3].
box(.16,1.05,8,paint,-3.4,.525,-.8);box(.16,.9,8,paint,-3.4,4.25,-.8);
box(.16,2.8,2.3,paint,-3.4,2.43,2.45);box(.16,2.8,.7,paint,-3.4,2.43,-3.45);
for(const y of [1.05,3.8])box(.26,.10,4.55,trim,-3.3,y,-.9);
for(const z of [-3.1,-.9,1.3])box(.13,2.8,.07,trim,-3.3,2.44,z);
const slats=[];for(let j=0;j<20;j++)slats.push(box(.085,.044,4.4,trim,-3.26,0,-.9));
box(4.55,.11,1.89,walnut,0,1.17,-1.08);
for(const x of [-1.96,1.96])for(const z of [-1.88,-.27])box(.075,1.12,.075,steel,x,.57,z);
box(.65,.04,.43,steel,.22,1.245,-1.61);box(.09,.33,.09,steel,.22,1.39,-1.65);
box(1.84,1.05,.095,steel,.22,2.04,-1.66);
// A wall beyond the aperture carries a painted, distant tree line.
function garden(){const c=document.createElement('canvas');c.width=896;c.height=480;const g=c.getContext('2d'),sky=g.createLinearGradient(0,0,0,480);sky.addColorStop(0,'#b6c9c1');sky.addColorStop(.65,'#e6d9b7');sky.addColorStop(1,'#859783');g.fillStyle=sky;g.fillRect(0,0,c.width,c.height);
 for(let layer=0;layer<3;layer++){g.fillStyle=['#a6b6a4','#93a58c','#768d7b'][layer];for(let i=0;i<155;i++){const x=rand()*960-25,y=290+30*layer+37*Math.sin(x*.008+layer)+rand()*29,r=10+rand()*28;g.beginPath();g.ellipse(x,y,r,r*(.5+rand()*.6),0,0,Math.PI*2);g.fill();g.fillRect(x-r,y,2*r,480-y);}}
 const tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;return tex;}
const vista=new T.Mesh(new T.PlaneGeometry(15,7),new T.MeshBasicMaterial({map:garden(),side:T.DoubleSide}));vista.rotation.y=Math.PI/2;vista.position.set(-5.8,2,-.8);scene.add(vista);
function wallpaper(){const c=document.createElement('canvas');c.width=800;c.height=450;const g=c.getContext('2d'),sky=g.createLinearGradient(0,0,0,450);sky.addColorStop(0,'#8caaa8');sky.addColorStop(.55,'#e4c99b');sky.addColorStop(1,'#687c6d');g.fillStyle=sky;g.fillRect(0,0,800,450);
 for(let j=0;j<4;j++){g.beginPath();g.moveTo(0,450);for(let i=0;i<=800;i+=2){const v=170+j*53-82*Math.sin(.007*i+j*.9)-22*Math.sin(i*.025+j);g.lineTo(i,v);}g.lineTo(800,450);g.fillStyle=['#b6b6a6','#839a90','#5d817b','#375f60'][j];g.fill();}
 const tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;return tex;}
box(1.76,.97,.007,new T.MeshBasicMaterial({map:wallpaper()}),.22,2.04,-1.609);
box(1.12,.04,.38,steel,.22,1.25,-.68);
const caps=new T.InstancedMesh(new T.BoxGeometry(.073,.031,.055),keys,52),dummy=new T.Object3D();
for(let row=0;row<4;row++)for(let col=0;col<13;col++){dummy.position.set(-.266+col*.08,1.286,-.795+row*.073);dummy.updateMatrix();caps.setMatrixAt(row*13+col,dummy.matrix);}caps.castShadow=caps.receiveShadow=true;scene.add(caps);
const mouse=new T.Mesh(new T.SphereGeometry(.11,24,16),steel);mouse.scale.set(.7,.43,1.18);mouse.position.set(1.07,1.258,-.67);scene.add(mouse);
box(.58,.064,.37,mat(0x704b39),-1.05,1.254,-.7).rotation.y=-.18;
const pot=mat(0x925736,.77),green=mat(0x3a6947,.65);cylinder(.18,.13,.31,pot,-1.45,1.386,-1.62);
for(let j=0;j<21;j++){const a=j*2.4,l=.24+rand()*.18;const leaf=new T.Mesh(new T.SphereGeometry(1,12,9),green);leaf.scale.set(.045,l,.075);leaf.position.set(-1.45+Math.cos(a)*.11,1.69+rand()*.08,-1.62+Math.sin(a)*.12);leaf.rotation.z=Math.cos(a)*.85;leaf.rotation.x=Math.sin(a)*.85;leaf.castShadow=true;scene.add(leaf);}
const brass=mat(0xb18a4e,.31,.65);cylinder(.17,.19,.04,brass,1.66,1.25,-1.45);cylinder(.014,.015,.65,brass,1.66,1.59,-1.45);cylinder(.075,.255,.23,mat(0xd7ab76,.52),1.66,1.91,-1.45);
scene.add(new T.HemisphereLight(0xe0e9da,0x947e66,1.48));const key=new T.DirectionalLight(0xffddb0,3.5);
const sun=new T.Vector3(-1,.47,-.27).normalize();key.position.copy(sun).multiplyScalar(9);key.target.position.set(0,0,0);scene.add(key,key.target);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.2,far:18});key.shadow.camera.updateProjectionMatrix();key.shadow.normalBias=.012;scene.add(key);
const lamp=new T.PointLight(0xffb875,3,3);lamp.position.set(1.66,1.78,-1.45);scene.add(lamp);
const target=new T.WebGLRenderTarget(1,1,{minFilter:T.LinearFilter,magFilter:T.LinearFilter});target.depthTexture=new T.DepthTexture(1,1,T.UnsignedIntType);
const post=new T.Scene(),ortho=new T.OrthographicCamera(-1,1,1,-1,0,1);
const uniforms={surface:{value:target.texture},depthMap:{value:target.depthTexture},invProjection:{value:camera.projectionMatrixInverse},world:{value:camera.matrixWorld},sun:{value:sun},opening:{value:.59}};
const pass=new T.ShaderMaterial({uniforms,depthTest:false,depthWrite:false,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,fragmentShader:`
varying vec2 vUv;uniform sampler2D surface,depthMap;uniform mat4 invProjection,world;uniform vec3 sun;uniform float opening;
// Integral of the clear portions of a repeated slat cell in pane space.
float openingIntegral(float y,float spacing){
 float q=y/spacing, f=fract(q), clearHalf=max(0.,.5-.039/spacing);
 return spacing*(floor(q)*2.*clearHalf+min(f,clearHalf)+max(0.,f-(1.-clearHalf)));
}
void main(){
 vec4 view=invProjection*vec4(vUv*2.-1.,texture2D(depthMap,vUv).r*2.-1.,1.);view/=view.w;
 vec3 eye=world[3].xyz,toPixel=(world*vec4(view.xyz,1.)).xyz-eye;
 float distanceToSurface=length(toPixel),ds=min(distanceToSurface,15.)/64.;vec3 dir=normalize(toPixel);
 float trans=1.,light=0.,blindsStep=mix(.1375,.029,opening);
 for(int i=0;i<64;i++){
   vec3 p=eye+dir*(float(i)+.5)*ds;
   if(p.x < -3.3||p.z < -3.8||p.z>2.8||p.y<0.||p.y>4.45)continue;
   vec3 pane=p+sun*((-3.3-p.x)/sun.x);float y=3.8-pane.y;
   float windowMask=step(0.,y)*step(y,2.75)*step(-3.1,pane.z)*step(pane.z,1.3)*smoothstep(.025,.055,abs(pane.z+.9));
   float footprint=max(.003,.5*ds*abs(dir.y-dir.x*sun.y/sun.x));
   float coverage=(openingIntegral(y+footprint,blindsStep)-openingIntegral(y-footprint,blindsStep))/(2.*footprint);
   float blind=mix(1.,clamp(coverage,0.,1.),1.-smoothstep(20.*blindsStep-footprint,20.*blindsStep+footprint,y));
   float portion=1.-exp(-.068*ds);
   light+=trans*portion*windowMask*blind;trans*=1.-portion;
 }
 vec3 color=texture2D(surface,vUv).rgb*trans+vec3(1.,.74,.44)*light*1.26;
 gl_FragColor=vec4(color,1.);
 #include <colorspace_fragment>
}`});
post.add(new T.Mesh(new T.PlaneGeometry(2,2),pass));
function draw(){const open=Number(slider.value)/100;uniforms.opening.value=open;const step=.1375+(.029-.1375)*open;slats.forEach((m,i)=>m.position.y=3.8-(i+.5)*step);
 const w=container.clientWidth,h=container.clientHeight;renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);target.setSize(canvas.width,canvas.height);camera.aspect=w/h;camera.updateProjectionMatrix();camera.updateMatrixWorld();
 renderer.setRenderTarget(target);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(post,ortho);}
slider.addEventListener('input',draw);new ResizeObserver(draw).observe(container);draw();
</script></body></html>
