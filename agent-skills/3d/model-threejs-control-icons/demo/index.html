<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Instrument tray</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#eee9dd;background:#1c2528;font:400 16px -apple-system,BlinkMacSystemFont,sans-serif}
main{min-height:100svh;display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 28% 16%,#4b5856 0,transparent 58%),linear-gradient(120deg,#26383a,#282a29 70%,#51423a)}
section{width:min(1050px,90vw)}h1{font:normal clamp(40px,5.6vw,76px)/1 Georgia,serif;letter-spacing:-.065em;margin:0 0 7vh}
.tray{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(5px,1.6vw,24px)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
button{position:relative;aspect-ratio:.83;border:1px solid #f6edd828;background:linear-gradient(154deg,#dcdad21c,#686f6b19 60%,#171d1c32);border-radius:clamp(15px,2.8vw,36px);font:inherit;color:inherit;box-shadow:0 12px 38px #10191833;cursor:pointer}
button[aria-pressed=true]{border-color:#f1cf9b96}
button:focus-visible{outline:2px solid #ffe1ae;outline-offset:4px}
button:before{content:"";position:absolute;left:19%;width:62%;top:72%;height:9%;border-radius:50%;background:radial-gradient(ellipse,#111a1aa8,transparent 68%)}
button span{position:absolute;left:0;right:0;bottom:7%;font-size:clamp(11px,1.5vw,20px);letter-spacing:-.025em}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><section><h1>Instrument tray</h1><div class="tray"><button aria-pressed="true"><span>Fountain pen</span></button><button aria-pressed="false"><span>Ribbon mic</span></button><button aria-pressed="false"><span>Hourglass</span></button><canvas aria-hidden="true"></canvas></div></section></main>
<script src="assets/three.min.js"></script><script>
const T=THREE,tray=document.querySelector('.tray'),buttons=[...tray.querySelectorAll('button')],reduced=matchMedia('(prefers-reduced-motion:reduce)');
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),alpha:true,antialias:true,premultipliedAlpha:true});renderer.setClearColor(0,0);
const scene=new T.Scene(),camera=new T.OrthographicCamera(-1.3,1.3,1.3,-1.3,.1,15);camera.position.set(0,.12,5);camera.lookAt(0,.04,0);
const satin=(color,roughness=.32,metalness=.85)=>new T.MeshStandardMaterial({color,roughness,metalness});
const gold=satin(0xd7a75f,.27),steel=satin(0xc3c7c7,.26),enamel=satin(0x226665,.21,.32),ink=satin(0x1a2324,.61,.15),sand=satin(0xf5c58a,.9,0);
function turned(group,profile,material){const m=new T.Mesh(new T.LatheGeometry(profile.map(([r,y])=>new T.Vector2(r,y)),48),material);group.add(m);return m;}
function tube(group,points,r,material){const curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));const m=new T.Mesh(new T.TubeGeometry(curve,32,r,10,false),material);group.add(m);return m;}
function ring(group,r,wire,y,material){const m=new T.Mesh(new T.TorusGeometry(r,wire,10,56),material);m.rotation.x=Math.PI/2;m.position.y=y;group.add(m);return m;}
const pen=new T.Group();turned(pen,[[.012,-.99],[.063,-.79],[.096,-.64],[.106,-.47],[.125,-.4],[.135,.69],[.126,.75],[.08,.78],[0,.79]],enamel);
turned(pen,[[0,-1.09],[.042,-.99],[.065,-.89],[.088,-.78],[.035,-.82],[0,-.84]],gold);
for(const y of [-.66,-.62,-.58,-.54,-.50,-.42,.69,.74])ring(pen,y>.6?.13:y<-.48?.101:.126,.012,y,y<-.48?steel:gold);
tube(pen,[[.02,.73,.10],[.07,.76,.14],[.095,.67,.19],[.091,.39,.18],[.09,.24,.16],[.075,.20,.12]],.027,steel);pen.rotation.z=-.47;
const mic=new T.Group();turned(mic,[[0,-.91],[.32,-.91],[.35,-.88],[.30,-.82],[.09,-.81],[.055,-.76],[.055,-.45]],gold);
tube(mic,[[-.42,.06,0],[-.43,-.26,0],[-.29,-.47,0],[0,-.50,0],[.29,-.47,0],[.43,-.26,0],[.42,.06,0]],.044,steel);
turned(mic,[[0,-.24],[.20,-.19],[.295,-.08],[.30,.4],[.25,.60],[.13,.68],[0,.70]],ink);
for(let i=0;i<11;i++){const y=-.10+i*.069;const radius=y<.40?.297:Math.sqrt(Math.max(.017,.09-(y-.4)**2));ring(mic,radius,.017,y,steel);}
for(const a of [-1,1])tube(mic,[[a*.13,-.14,.235],[a*.15,.18,.27],[a*.11,.57,.20]],.014,gold);
const timer=new T.Group();for(const y of [-.84,.79]){
 turned(timer,[[0,y],[.40,y],[.42,y+.025],[.41,y+.077],[.36,y+.10],[0,y+.10]],gold);
}
for(let i=0;i<3;i++){const a=.5+i*Math.PI*2/3,x=.355*Math.cos(a),z=.355*Math.sin(a);tube(timer,[[x,-.75,z],[x,.79,z]],.023,steel);}
const glass=new T.MeshPhysicalMaterial({color:0xd5ece6,roughness:.13,metalness:.08,transparent:true,opacity:.28,side:T.DoubleSide,depthWrite:false});
turned(timer,[[0,-.73],[.23,-.71],[.27,-.62],[.255,-.48],[.05,-.055],[.036,0],[.05,.07],[.255,.48],[.27,.62],[.24,.72],[0,.75]],glass).renderOrder=2;
turned(timer,[[0,-.71],[.218,-.68],[.246,-.61],[.208,-.56],[.10,-.46],[0,-.405]],sand);
turned(timer,[[0,.055],[.036,.08],[.13,.27],[.16,.34],[0,.34]],sand);tube(timer,[[0,-.41,0],[.003,.052,0]],.006,sand);
const models=[pen,mic,timer];for(const m of models)scene.add(m);
const rig=new T.RoomEnvironment();for(const [x,y,z,w,h,color] of [[-3,2,3,1,6,0xc2e6ff],[4,1,1,.65,5,0xffcc89]]){
 const m=new T.MeshBasicMaterial({color,side:T.DoubleSide});m.color.multiplyScalar(5);const strip=new T.Mesh(new T.PlaneGeometry(w,h),m);strip.position.set(x,y,z);strip.lookAt(0,0,0);rig.add(strip);}
const generator=new T.PMREMGenerator(renderer),env=generator.fromScene(rig,.03);scene.environment=env.texture;generator.dispose();rig.dispose();
scene.add(new T.HemisphereLight(0xe7efea,0x786552,1.08));const key=new T.DirectionalLight(0xfff5db,2.6);key.position.set(-4,5,4);scene.add(key);
const atlas=new T.WebGLRenderTarget(1,1,{samples:Math.min(4,renderer.capabilities.maxSamples),minFilter:T.LinearFilter,magFilter:T.LinearFilter});
const composite=new T.Scene(),flat=new T.OrthographicCamera(-1,1,1,-1,0,1);
const u={atlas:{value:atlas.texture},rects:{value:Array.from({length:3},()=>new Float32Array(4)).flatMap(v=>Array.from(v))}};
const display=new T.ShaderMaterial({uniforms:u,transparent:true,depthTest:false,depthWrite:false,vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:`
 varying vec2 vUv;uniform sampler2D atlas;uniform vec4 rects[3];
 void main(){vec4 icon=vec4(0.);for(int i=0;i<3;i++){vec2 t=(vUv-rects[i].xy)/rects[i].zw;if(all(greaterThanEqual(t,vec2(0.)))&&all(lessThanEqual(t,vec2(1.)))){
 icon=texture2D(atlas,vec2((float(i)+t.x)/3.,t.y));}}
 gl_FragColor=vec4(icon.rgb/max(.001,icon.a),icon.a);
 #include <colorspace_fragment>
 }`});composite.add(new T.Mesh(new T.PlaneGeometry(2,2),display));
let focus=0,angles=[.08,-.33,-.24],frame=0,last=0;
function paint(time){frame=0;const dt=Math.min(.05,(time-last)/1000);last=time;const b=tray.getBoundingClientRect(),dpr=Math.min(devicePixelRatio,2);
 renderer.setPixelRatio(dpr);renderer.setSize(b.width,b.height,false);const size=Math.ceil(buttons[0].clientWidth*.9*dpr);
 if(atlas.height!==size)atlas.setSize(3*size,size);
 atlas.scissorTest=true;
 const rectangles=[];let moving=false;
 models.forEach((m,i)=>{const goal=(i===focus?.36:-.31)+(i===2?.24:0);angles[i]=reduced.matches?goal:angles[i]+(goal-angles[i])*(1-Math.exp(-dt*7));if(Math.abs(goal-angles[i])>.002)moving=true;
 m.rotation.y=angles[i];models.forEach((n,j)=>n.visible=i===j);
 atlas.viewport.set(i*size,0,size,size);atlas.scissor.set(i*size,0,size,size);renderer.setRenderTarget(atlas);renderer.clear();renderer.render(scene,camera);
 const a=buttons[i].getBoundingClientRect(),side=Math.min(a.width*.91,a.height*.79);
 rectangles.push((a.left-b.left+(a.width-side)/2)/b.width,(b.bottom-a.top-a.height*.45-side/2)/b.height,side/b.width,side/b.height);});
 renderer.setScissorTest(false);renderer.setRenderTarget(null);renderer.setViewport(0,0,b.width,b.height);u.rects.value=rectangles;renderer.render(composite,flat);if(moving)request();}
function request(){if(!frame)frame=requestAnimationFrame(paint);}
buttons.forEach((b,i)=>b.addEventListener('click',()=>{focus=i;buttons.forEach((v,j)=>v.setAttribute('aria-pressed',String(i===j)));request();}));new ResizeObserver(request).observe(tray);request();
</script></body></html>
