function woodlandStudy(host, mode) {

    const trees=[],wood=[],mat=new T.Matrix4(),rot=new T.Quaternion(),up=V(0,1,0),crownGeo=new T.BufferGeometry(),verts=[];

    stands(crownGeo,new T.MeshStandardMaterial({side:T.DoubleSide,roughness:1}),trees,true);
    stands(new T.CylinderGeometry(.6,1,1,5),new T.MeshStandardMaterial({color:0x443d2a}),wood,false);
    const ripple=new T.PlaneGeometry(1,.025);ripple.rotateX(-Math.PI/2);
    const strokes=[];for(let i=0;i<160;i++){const z=10-random()*53;strokes.push(mat.compose(V(river(z)+(random()-.5)*1.8,-.103,z),rot.setFromAxisAngle(up,Math.sin(z*.13)*.22),V(.08+random()*.8,1,.5+random())).clone());}

  }else{
    const bark=new T.CatmullRomCurve3([V(-2.8,-.38,.05),V(-1.4,.04,0),V(-.45,-.08,.13),V(.42,.36,0),V(1.2,.27,-.12),V(2.7,.74,-.16)]);
    const branch=mesh(new T.TubeGeometry(bark,55,.16,9,false),0x57452d,root);
    for(let i=0;i<110;i++){const p=bark.getPoint(random());const m=mesh(new T.IcosahedronGeometry(.09+random()*.17,0),new T.Color().setHSL(.207,.33,.16+random()*.15),root,p.x,p.y+.14,p.z+(random()-.5)*.20);m.scale.y=.45;}
    for(let i=0;i<4;i++){let p=bark.getPoint(.16+i*.19);let side=i%2?1:-1;const path=new T.CatmullRomCurve3([p,p.clone().add(V(.2,.18,side*.15)),p.clone().add(V(.5,.32,side*.43))]);mesh(new T.TubeGeometry(path,9,.037,5),0x635137,root);}

      }));root.add(cage);u=cage.material.uniforms.front;
      const indicator=host.parentElement.querySelector('input'),track=host.closest('.survey-track');
      const range=()=>Math.max(1,track.offsetHeight-host.closest('.pin').offsetHeight);
      function sync(){const pct=Math.max(0,Math.min(1,-track.getBoundingClientRect().top/range()));indicator.value=Math.round(pct*100);u.value=-2.8+pct*5.5;indicator.setAttribute('aria-valuetext',indicator.value+' percent');wake();}
      indicator.addEventListener('input',()=>{scrollTo({top:scrollY+track.getBoundingClientRect().top+range()*Number(indicator.value)/100,behavior:'instant'});sync()});
      window.addEventListener('scroll',sync,{passive:true});new ResizeObserver(sync).observe(track);sync();
    }
    if(mode==='plant'){
      root.visible=false;const soil=mesh(new T.IcosahedronGeometry(1.21,2),0x534434,plant,0,-.67,0);soil.scale.set(1.3,.28,1);
      for(let i=0;i<92;i++){const a=random()*6.28,r=Math.sqrt(random())*1.15;let m=mesh(new T.IcosahedronGeometry(.12+random()*.17,0),new T.Color().setHSL(.20,.33,.13+random()*.17),plant,r*Math.cos(a),-.39-.2*r*r,r*Math.sin(a));m.scale.y=.63;}
      for(const [x,z,s] of [[-.68,.28,.48],[.64,.24,.32],[.25,-.52,.29]]){const rock=mesh(new T.DodecahedronGeometry(s),0xbab69d,plant,x,-.32,z);rock.scale.y=.65;}
      for(let j=0;j<15;j++){const group=new T.Group();plant.add(group);group.position.y=-.36;group.rotation.y=j*2.399;fronds.push(group);
        const h=1+random()*.92,l=.55+random()*.8,point=v=>V(l*v*v,h*(1.5*v-.7*v*v),0);
        const stem=new T.CatmullRomCurve3([point(0),point(.33),point(.66),point(1)]);mesh(new T.TubeGeometry(stem,18,.012,4),0x879459,group);
        const verts=[];for(let n=1;n<=15;n++){const v=n/16,p=point(v),span=Math.sin(v*Math.PI)**.67*.32+.012;
          for(const sign of [-1,1]){const tip=p.clone().add(V(span*.37,span*.32,span*sign)),rib=p.clone().lerp(tip,.46).add(V(.018,.047,0));
          const a=p.clone().add(V(-.034,0,0)),b=p.clone().add(V(.052,.017,0));for(const vv of [a,tip,rib,rib,tip,b])verts.push(vv.x,vv.y,vv.z);}}
        const leaves=new T.BufferGeometry();leaves.setAttribute('position',new T.Float32BufferAttribute(verts,3));leaves.computeVertexNormals();mesh(leaves,new T.Color().setHSL(.213,.38,.23+random()*.09),group);}
    }
    if(mode==='insect'){

      for(const s of [-1,1]){const pivot=new T.Group();animal.add(pivot);pivot.position.x=s*.036;wings.push(pivot);
        const path=new T.Shape();path.moveTo(0,-.16);path.bezierCurveTo(.20,-.50,.53,-.46,.54,-.29);path.bezierCurveTo(.57,-.18,.35,-.06,.40,-.05);
        path.bezierCurveTo(1.00,-.10,1.01,.35,.91,.65);path.bezierCurveTo(.68,.68,.22,.33,0,.04);path.closePath();

        for(let leg=0;leg<3;leg++){const z=(leg-1)*.071;mesh(new T.TubeGeometry(new T.CatmullRomCurve3([V(s*.04,-.015,z),V(s*.097,-.063,z+.018),V(s*.105,-.092,z+.051)]),5,.005,4),0x483a28,animal);}

const views=Array.from(document.querySelectorAll('[data-art]'),h=>woodlandStudy(h,h.dataset.art));
const shots=[...document.querySelectorAll('[data-shot]')];function choose(p){views[0].set(p);for(const b of shots)b.setAttribute('aria-pressed',Math.abs(Number(b.dataset.shot)-p)<.25?'true':'false')}for(const b of shots)b.onclick=()=>choose(Number(b.dataset.shot));addEventListener('scroll',()=>choose(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)),{passive:true});
</script></body></html>
