<main class="app" id="app">
  <canvas id="stage" role="img" aria-label="Black lightning skill effects over a dark stone plain: a white-blue energy orb ahead of an unseen fist, wrapped in black smoke that trails it, with branching lightning, air bursts, orange sparks and falling debris"></canvas>

  <header class="title">
    <h1>Black Lightning</h1>
    <p>Energy skill VFX · Three.js</p>
  </header>

  <p class="caption" aria-hidden="true"><span id="capBeat">Full cast</span><span class="sep">/</span><span id="capText">Black lightning awakening</span></p>

  <section class="options" aria-label="Compare each failure">
    <p class="note" id="note">Each switch shows one failure next to the version that works.</p>
    <div class="row" role="group" aria-labelledby="g-lightning">
      <span class="label" id="g-lightning">Lightning</span>
      <span class="pills">
        <button type="button" data-opt="lightning" data-val="reroll" aria-pressed="true">Re-rolled</button>
        <button type="button" data-opt="lightning" data-val="tween" aria-pressed="false">Tweened</button>
      </span>
    </div>
    <div class="row" role="group" aria-labelledby="g-afterimage">
      <span class="label" id="g-afterimage">Afterimage</span>
      <span class="pills">
        <button type="button" data-opt="afterimage" data-val="over" aria-pressed="true">Smoke over</button>
        <button type="button" data-opt="afterimage" data-val="additive" aria-pressed="false">Additive</button>
      </span>
    </div>
    <div class="row" role="group" aria-labelledby="g-orb">
      <span class="label" id="g-orb">Orb</span>
      <span class="pills">
        <button type="button" data-opt="orb" data-val="lens" aria-pressed="true">Air lens</button>
        <button type="button" data-opt="orb" data-val="glow" aria-pressed="false">Glow ball</button>
      </span>
    </div>
    <div class="row" role="group" aria-labelledby="g-flashes">
      <span class="label" id="g-flashes">Flashes</span>
      <span class="pills">
        <button type="button" data-opt="flashes" data-val="full" aria-pressed="true">Full</button>
        <button type="button" data-opt="flashes" data-val="safe" aria-pressed="false">Safe</button>
      </span>
    </div>
  </section>

  <nav class="dock" aria-label="Skill beats">
    <button type="button" class="icon" id="play" aria-label="Pause">
      <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="2.4" height="10" rx=".8"/><rect x="9.6" y="3" width="2.4" height="10" rx=".8"/></svg>
      <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6c0 .5.6.8 1 .5l7.4-4.8c.4-.3.4-.8 0-1.1L6 2.7c-.4-.3-1 0-1 .5z"/></svg>
    </button>
    <div class="beats">
      <button type="button" data-beat="all" aria-pressed="true" aria-keyshortcuts="0">Full cast</button>
      <button type="button" data-beat="charge" aria-pressed="false" aria-keyshortcuts="1">Charge</button>
      <button type="button" data-beat="dash" aria-pressed="false" aria-keyshortcuts="2">Dash</button>
      <button type="button" data-beat="barrage" aria-pressed="false" aria-keyshortcuts="3">Barrage</button>
      <button type="button" data-beat="storm" aria-pressed="false" aria-keyshortcuts="4">Storm ring</button>
      <button type="button" data-beat="ultimate" aria-pressed="false" aria-keyshortcuts="5">Ultimate</button>
    </div>
    <label class="speed" for="speed"><span class="sr-only">Time scale</span><input id="speed" type="range" min="0.1" max="1" step="0.05" value="1"><output id="speedOut" for="speed">1.00×</output></label>
  </nav>

  <button type="button" class="hide" id="hide" aria-pressed="false" aria-label="Hide controls (H)">H</button>
  <p class="sr-only" id="live" aria-live="polite"></p>
</main>
