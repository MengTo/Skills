<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Explainer Video: its own film, live</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0a0a0c; color: #f5f5f7; font: 500 14px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
h1 { margin: 0; font-size: 17px; font-weight: 600; }
header p { margin: 0; color: #86868b; }
.embed header { display: none; }
.embed { padding: 10px; }
.rows { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.row { display: flex; align-items: center; gap: 6px; }
.row > span { color: #86868b; margin-right: 2px; }
button { padding: 6px 11px; border: 0; border-radius: 7px; background: rgba(255, 255, 255, 0.08); color: inherit; font: inherit; cursor: pointer; }
button:hover { background: rgba(255, 255, 255, 0.14); }
button[aria-pressed='true'] { background: #f5f5f7; color: #0a0a0c; }
button:focus { outline: none; }
html[data-tabbing] button:focus-visible { outline: 2px solid #efb36c; outline-offset: 2px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
iframe { display: block; border: 0; border-radius: 10px; background: #0a0a0c; max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<header>
  <h1>HTML Explainer Video, its own film</h1>
  <p>One script and one set of scenes. Change the look, the shape and the camera: it's all live HTML.</p>
</header>
<div class="rows" role="group" aria-label="The film's settings">
  <div class="row" data-k="look"><span>Look</span><button data-v="night">Night</button><button data-v="paper">Paper</button><button data-v="poster">Poster</button><button data-v="terminal">Terminal</button></div>
  <div class="row" data-k="shape"><span>Shape</span><button data-v="4:3">4:3</button><button data-v="16:9">16:9</button><button data-v="1:1">1:1</button><button data-v="9:16">9:16</button></div>
  <div class="row" data-k="camera"><span>Camera</span><button data-v="off">Off</button><button data-v="on">On</button></div>
</div>
<div class="stage"><iframe id="film" title="The skill's own film, drawn live from one clock" allow="autoplay"></iframe></div>
<script>
const q = new URLSearchParams(location.search);
if (q.has('embed')) document.body.classList.add('embed');
const state = { look: q.get('look') || 'night', shape: q.get('shape') || '4:3', camera: q.get('camera') || 'off' };
const SHAPES = { '4:3': [4, 3], '16:9': [16, 9], '1:1': [1, 1], '9:16': [9, 16] };
const frame = document.getElementById('film');
const box = document.querySelector('.stage');
let at = 0;
// Asked for less motion: it holds on its cover until it's played.
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let moved = false;
addEventListener('message', (e) => {
  if (e.data && e.data.explainer === 'time') at = e.data.t;
});
function size() {
  const [w, h] = SHAPES[state.shape];
  // The film's clock sits under it, not over it.
  const bar = 54;
  const k = Math.min(box.clientWidth / w, (box.clientHeight - bar) / h);
  frame.style.width = Math.floor(w * k) + 'px';
  frame.style.height = Math.floor(h * k) + bar + 'px';
}
function load() {
  document.querySelectorAll('.row').forEach((r) => r.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state[r.dataset.k]))));
  size();
  const u = new URLSearchParams({ look: state.look, shape: state.shape, camera: state.camera, captions: 'on', at: at.toFixed(2) });
  if (calm && !moved) u.set('still', '1');
  frame.src = `film.html?${u}&controls`;
}
document.querySelectorAll('.row').forEach((r) => r.addEventListener('click', (e) => {
  const v = e.target.dataset && e.target.dataset.v;
  if (!v || state[r.dataset.k] === v) return;
  state[r.dataset.k] = v;
  load();
}));
addEventListener('resize', size);
addEventListener('keydown', (e) => { if (e.key === 'Tab') document.documentElement.setAttribute('data-tabbing', ''); });
addEventListener('pointerdown', () => document.documentElement.removeAttribute('data-tabbing'));
load();
</script>
</body>
</html>
