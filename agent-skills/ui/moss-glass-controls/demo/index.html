<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moss Glass Controls</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f1f0e6;color:#26352a;font:350 16px/1.5 Lexend,'Helvetica Neue',sans-serif}button,a,input{font:inherit}button,a{touch-action:manipulation}a{color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #aebd71;outline-offset:4px}.shell{position:relative;max-width:1560px;margin:auto;padding-inline:clamp(24px,5vw,90px)}.shell::before{content:'';position:absolute;inset:0 clamp(13px,3.9vw,69px);border-inline:1px solid currentColor;pointer-events:none;opacity:.13}.bar,.cap{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px}.bar{height:85px;border-bottom:1px solid #78867044}.brand{font-size:21px;font-weight:500;letter-spacing:-.05em;text-decoration:none}.brand:before{content:'✳';margin-right:.48em;color:#94a371}.meta,.cap{font-size:11px;letter-spacing:.115em;text-transform:uppercase}.panel{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:4vw;min-height:calc(100svh - 140px);align-items:center}.copy{max-width:630px;position:relative;z-index:2}.k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}.k:before{content:'●';font-size:9px;margin-right:10px;color:#82906a}h1,h2{font-weight:330;line-height:.99;letter-spacing:-.07em;margin:.24em 0}h1{font-size:clamp(52px,7.7vw,116px)}h2{font-size:clamp(38px,5.6vw,84px)}p{max-width:39ch;font-size:clamp(16px,1.42vw,22px);line-height:1.55}.cap{padding:17px 0;border-top:1px solid #78867044;letter-spacing:.05em}.art{position:relative;height:clamp(340px,68vh,740px);border-radius:3px;min-width:0}.art canvas,.world canvas{display:block;width:100%;height:100%}.paper .art{background:radial-gradient(ellipse,#d0d2b7 0%,#e6e6d7 43%,transparent 72%)}.reg{position:absolute;inset:6%;border:1px solid #7f8c6924;pointer-events:none}.reg:after{content:'';position:absolute;top:55%;left:-3%;width:106%;height:1px;background:#63745626;transform:rotate(-16deg)}.art .fig{position:absolute;bottom:0;right:2%;font-size:11px;letter-spacing:.08em}.dark{background:#18271f;color:#eeeddc}.world{position:absolute;inset:0;overflow:hidden;pointer-events:none}.world:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0c2019d9,#17261a39 71%),linear-gradient(0deg,#1423198c,transparent 48%)}.stage{position:relative;isolation:isolate;overflow:hidden}.stage>.shell{z-index:1}.stage .bar,.dark .bar,.dark .cap{border-color:#d5ddc43b}.stage h1{max-width:10.5ch}.rim,.dock{background:linear-gradient(155deg,#3a4736,#243128);border:1px solid #dbe4c92b;color:#eef0d9;box-shadow:inset 0 1px #f4f5cf24,0 6px 18px #131b1229}.rim{position:relative;display:inline-flex;align-items:center;justify-content:space-between;gap:18px;padding:7px 8px 7px 17px;border-radius:30px;text-decoration:none;min-height:44px;font-size:14px}.rim i{font:400 18px/32px sans-serif;width:32px;text-align:center;color:#2f3c2f;background:#e5e8ce;border-radius:100%}.rim:after{content:'';position:absolute;inset:-1px;border-radius:inherit;opacity:0;padding:1.4px;background:conic-gradient(from var(--angle,0deg),transparent 10%,#f6e8ad 27%,#9ac7d5 34%,transparent 55%,#bdc990 78%,transparent 92%);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;-webkit-mask-composite:xor;pointer-events:none}.rim:is(:hover,:focus-visible):after{opacity:1;animation:turn 2.4s linear infinite}@property --angle{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes turn{to{--angle:360deg}}.rim:active{transform:scale(.975)}.dock{display:inline-flex;gap:3px;border-radius:12px;padding:4px}.dock a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;min-height:36px;border-radius:7px;text-decoration:none;font-size:11px;font-weight:590;letter-spacing:.08em;text-transform:uppercase;background:#e7e8ce0a}.dock a[aria-current]{color:#253024;background:#eef0d9}.dock a:hover{box-shadow:inset 0 0 0 1px #92a381}.ico{width:14px;height:14px}.spread{min-height:84svh;display:grid;gap:5vw;grid-template-columns:1.1fr .9fr;align-items:center;padding-block:8vh}.spread ul{padding:0;list-style:none}.spread li,.steps button{padding:15px 0;border-block-end:1px solid #7d876840}.steps button{display:block;width:100%;text-align:left;background:none;color:inherit;border-width:0 0 1px}.steps button[aria-expanded=true]{font-weight:600}.card{background:linear-gradient(145deg,#3e4a38,#253329);color:#e9ebd6;border:1px solid #a2ae8645;border-radius:24px;padding:9px;box-shadow:0 12px 32px #0c140e29;max-width:410px;justify-self:center;width:100%}.plate{width:100%;height:clamp(140px,24vh,235px);object-fit:cover;border-radius:16px;display:block;background:#787f5e}.inside{padding:15px 17px 18px}.inside h2{font-size:34px;letter-spacing:-.045em}.inside p{font-size:16px;max-width:35ch}.footword{font-size:clamp(75px,18vw,260px);letter-spacing:-.09em;line-height:1.12}.spec{background:radial-gradient(ellipse at 64% 38%,#637251,#263829 72%)}label.range{display:block;max-width:280px;margin-top:24px}input[type=range]{display:block;width:100%;accent-color:#6b805a;min-height:36px}.pin{position:sticky;top:0}.scrollpad{height:90vh}.panel.one{grid-template-columns:1fr}.world-note{justify-self:end}.figure-img{display:block;width:100%;aspect-ratio:1.23;object-fit:cover;border-radius:2px}.price{font-size:54px;letter-spacing:-.06em}.card .price{margin:.25em 0}.wordmark{font-weight:350}.buttons{display:flex;gap:10px;align-items:center}.buttons>button{padding:8px 14px;min-height:44px;border:1px solid #8f9c7890;background:transparent;color:inherit;border-radius:24px}.buttons>button[aria-pressed=true]{background:#e4e9d5;color:#28392e}.pollen-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

dialog{color:#25372a;background:#f1f1e4;max-width:min(90vw,500px);padding:35px;border:1px solid #7e8c72;border-radius:20px}dialog::backdrop{background:#16261bb0}</style></head><body><main><section class="dark spec"><div class="shell"><div class="bar"><span class="brand">Alder</span><span class="meta">Woodland field studies</span></div><div class="panel "><div class="copy"><div class="k">Visitor guide</div><h1>Field notes.</h1><p>A pair of woodland controls share one moss-glass surface. Hover a rim, or open a note with the keyboard.</p><button type="button" class="rim">Read the field note <i aria-hidden="true">↗</i></button></div><article class="card"><img class="plate" src="assets/fern.jpg" alt="Folded fern fronds over a moss bed"><div class="inside"><div class="k">Botanical study</div><h2>A closer look.</h2><p>Look under the arch of the largest frond.</p><button type="button" class="rim">Study the fern <i aria-hidden="true">↗</i></button></div></article></div><div class="cap"><span>Alder field station</span><span>Glass control study</span></div></div></section><dialog><h2></h2><p></p><form method="dialog"><button class="rim">Close note</button></form></dialog></main><script>
const modal=document.querySelector('dialog');document.querySelectorAll('section button').forEach((b,i)=>b.onclick=()=>{modal.querySelector('h2').textContent=i?'The fern bed.':'Field note.';modal.querySelector('p').textContent=i?'Each frond starts at the same cushion; smaller leaves open near the tip.':'A thin line of water marks the old channel under the moss.';modal.showModal();});
</script></body></html>
