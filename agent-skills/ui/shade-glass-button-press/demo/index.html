<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Afterlight switch</title>
<style>
* {box-sizing:border-box}
body {margin:0;background:#34555c;color:#fff;font:400 16px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
main {height:100svh;min-height:340px;position:relative;overflow:hidden;isolation:isolate}
canvas {position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
h1 {position:absolute;left:5vw;top:5vh;margin:0;font:normal clamp(34px,5vw,78px)/.98 Georgia,serif;letter-spacing:-.06em;color:#fff8ed;text-shadow:0 1px 8px #11232730}
button {position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(73vw,340px);height:146px;border:0;border-radius:42px;background:transparent;color:#fff;font:inherit;touch-action:none;user-select:none;text-shadow:0 1px 8px #1523227a}
button strong,button span{display:block;pointer-events:none}
button strong{font-size:clamp(31px,4.3vw,49px);font-weight:400;letter-spacing:-.06em}
button strong{position:relative;transform:translate(var(--ink-x,0px),var(--ink-y,0px))}
button strong::before,button strong::after{content:attr(data-ink);position:absolute;inset:0;color:#9ef7ed;transform:translateX(-1.5px);opacity:var(--fringe,0);mask-image:radial-gradient(ellipse var(--rx,1px) var(--ry,1px) at var(--contact-x,50%) var(--contact-y,50%),transparent 72%,black 95%,transparent 113%)}
button strong::after{color:#ffc1b1;transform:translateX(1.5px)}
button span{font-size:13px;opacity:.75;margin-top:7px}
button:focus-visible {outline:2px solid ivory;outline-offset:6px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><canvas aria-hidden="true"></canvas><h1>Afterlight</h1><button type="button"><strong data-ink="Change light">Change light</strong><span>Daylight</span></button></main>
<script>
const pressDemo=true, main=document.querySelector('main'), button=document.querySelector('button');
const canvas=document.querySelector('canvas'), reduced=matchMedia('(prefers-reduced-motion: reduce)');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false});
button.style.cursor=pressDemo?'pointer':'grab';if(pressDemo)button.setAttribute('aria-pressed','false');
function seascape(){
  const map=document.createElement('canvas');map.width=2560;map.height=1440;
  const ctx=map.getContext('2d'),w=map.width,h=map.height;
  let seed=1873;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
  const fill=ctx.createLinearGradient(0,0,0,h);fill.addColorStop(0,'#24485f');fill.addColorStop(.32,'#c7bab1');fill.addColorStop(.51,'#f0c896');fill.addColorStop(.53,'#b1bbad');fill.addColorStop(1,'#20474d');
  ctx.fillStyle=fill;ctx.fillRect(0,0,w,h);
  const sun=ctx.createRadialGradient(w*.73,h*.29,0,w*.73,h*.29,w*.25);sun.addColorStop(0,'#fff4cd');sun.addColorStop(.052,'#fff2c9');sun.addColorStop(.059,'#f7d1a17a');sun.addColorStop(1,'#edb18900');ctx.fillStyle=sun;ctx.fillRect(0,0,w,h*.55);
  function ridge(x,layer){const z=x/w;return .454+layer*.012+(.032+.017*layer)*Math.sin(z*9+layer*1.76)+.015*Math.sin(z*24+layer*3)+.006*Math.sin(z*83)+.002*Math.cos(z*391);}
  ['#a6acae','#838f95','#687f86','#41616b'].forEach((color,j)=>{ctx.beginPath();ctx.moveTo(0,h*.55);for(let x=0;x<=w;x+=2)ctx.lineTo(x,h*ridge(x,j));ctx.lineTo(w,h*.56);ctx.lineTo(0,h*.56);ctx.fillStyle=color;ctx.fill();});
  const sky=ctx.getImageData(0,0,w,Math.floor(h*.56)),water=ctx.createImageData(w,h-sky.height);
  for(let y=0;y<water.height;y++){const depth=y/water.height,fromY=Math.max(0,sky.height-1-Math.floor(y*.82+8*Math.sin(y*.22)*depth));
    for(let x=0;x<w;x++){const sx=Math.min(w-1,Math.max(0,x+Math.floor(12*depth*Math.sin(y*.14+x*.013)+4*Math.sin(y*.72))));
      const a=(fromY*w+sx)*4,b=(y*w+x)*4;for(let c=0;c<3;c++)water.data[b+c]=sky.data[a+c]*(.76-.32*depth)+[13,34,36][c]*depth;water.data[b+3]=255;}}
  ctx.putImageData(water,0,sky.height);
  for(let i=0;i<13500;i++){const x=random()*w,y=random()**.8,level=h*(.56+.44*y);
    ctx.fillStyle=random()>.46?'rgba(255,226,187,'+(.07+.12*random())+')':'rgba(12,54,63,.12)';
    ctx.fillRect(x,level,(2+random()*40)*(.3+y),.4+y*1.5);}
  function pine(x,y,size){ctx.fillStyle='#203c40';ctx.fillRect(x-size*.013,y-size,size*.027,size);for(let j=0;j<11;j++){const v=(j+1)/12,r=size*(.01+.16*v);ctx.beginPath();ctx.moveTo(x,y-size+v*size*.76-size*.15);ctx.lineTo(x+r*(.7+random()*.3),y-size+v*size*.92);ctx.lineTo(x-r,y-size+v*size*.94);ctx.closePath();ctx.fill();}}
  ctx.beginPath();ctx.moveTo(0,h*.72);ctx.bezierCurveTo(w*.19,h*.68,w*.22,h*.57,w*.52,h*.571);ctx.bezierCurveTo(w*.28,h*.65,w*.25,h*.84,0,h*.93);ctx.fillStyle='#284447';ctx.fill();
  for(let i=0;i<460;i++){const x=random()*.49, y=.572+.15*(1-x/.49)**2;pine(x*w,y*h,(.009+.10*(1-x/.49)**2)*h*(.45+random()*.7));}
  return map;
}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const vertex=`#version 300 es
void main(){vec2 corners[3]=vec2[3](vec2(-1,-1),vec2(3,-1),vec2(-1,3));gl_Position=vec4(corners[gl_VertexID],0,1);}`;
const fragment=`#version 300 es
precision highp float;
uniform sampler2D shore;uniform vec2 viewport,bufferSize,center,halfExtent,contact;uniform float hold,age,evening,shear;
out vec4 outputColor;
float sd(vec2 p,float r){vec2 q=abs(p)-halfExtent+r;return min(max(q.x,q.y),0.)+length(max(q,0.))-r;}
vec3 scene(vec2 px){vec2 uv=px/viewport;float a=viewport.x/viewport.y/(16./9.);
  uv=(uv-.5)*vec2(min(1.,a),min(1.,1./a))+.5;
  vec3 c=texture(shore,clamp(uv,0.,1.)).rgb;return mix(c,c*vec3(.83,.66,.74)+vec3(.10,.013,.022),evening);}
void main(){
 vec2 px=vec2(gl_FragCoord.x/bufferSize.x,1.-gl_FragCoord.y/bufferSize.y)*viewport,p=px-center;p.x-=shear*p.y;
 float r=min(42.,halfExtent.y),d=sd(p,r),aa=max(fwidth(d),.1),mask=1.-smoothstep(-aa,aa,d);
 vec3 room=scene(px),glass=room;
 if(d<2.*aa){
  vec2 normal=normalize(vec2(sd(p+vec2(.5,0),r)-sd(p-vec2(.5,0),r),sd(p+vec2(0,.5),r)-sd(p-vec2(0,.5),r))+vec2(.00001));
  float depth=max(0.,-d),lip=1.-smoothstep(0.,r*.68,depth),tilt=.91*lip-.13*exp(-pow((depth/r-.56)/.19,2.));
  vec3 N=vec3(normal*tilt,sqrt(1.-tilt*tilt)),ray=refract(vec3(0,0,-1),N,1./1.46);
  vec2 delta=px-contact,dir=delta/max(length(delta),.01);
  float reach=length((halfExtent+abs(contact-center))*vec2(1.,1.22)),t=clamp(age/.82,0.,1.);
  float distanceToWave=length(delta*vec2(1.,1.22))-(1.-pow(1.-t,1.65))*(reach+42.);
  float crest=age<0.?0.:exp(-pow(distanceToWave/16.,2.))*(1.-smoothstep(.70,1.,t));
  float wake=age<0.?0.:exp(-pow((distanceToWave+22.)/28.,2.))*(1.-t);
  vec2 bent=px+ray.xy/max(.15,-ray.z)*r*1.43-delta*.19*hold*exp(-dot(delta,delta)/3400.)+dir*(crest*16.-wake*7.);
  vec2 split=dir*crest*4.;
  glass=vec3(scene(bent+split).r,scene(bent).g,scene(bent-split).b);
  glass=mix(glass,vec3(.83,.93,.91),.12)+scene(px+normal*r*2.)*(lip*.24+crest*.13);
  glass+=vec3(1.,.96,.87)*(.68*exp(-depth/1.12)+.17*pow(lip,3.))*(.6+.4*dot(normal,normalize(vec2(-.6,-1.))));
 }
 outputColor=vec4(mix(room,glass,mask),1.);
}`;
if(gl){
 const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
 const names=['viewport','bufferSize','center','halfExtent','contact','hold','age','evening','shear'];
 const u=Object.fromEntries(names.map(n=>[n,gl.getUniformLocation(program,n)]));
 const texture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,seascape());gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
 let x=.5,y=.52,dx=0,dy=0,hold=0,target=0,at=-Infinity,contact=[.5,.5],previous=0,frame=0,session=null,dusk=false,flex=0,speed=0,lastX=0,cancelClick=false;
 function render(now){frame=0;const dt=Math.min(.032,Math.max(0,(now-previous)/1000));previous=now;
  hold+=(target-hold)*(1-Math.exp(-dt*23));speed+=(-220*flex-13*speed)*dt;flex+=speed*dt;if(reduced.matches){flex=speed=0;hold=target;}
  const w=main.clientWidth,h=main.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
  gl.viewport(0,0,canvas.width,canvas.height);
  const shear=pressDemo?0:Math.max(-.16,Math.min(.16,flex/55));button.style.transform='translate(-50%,-50%) matrix(1,0,'+shear+',1,0,0)';button.style.left=(x*w+flex)+'px';button.style.top=y*h+'px';
  const b=button.getBoundingClientRect(),cx=b.x+b.width*.5,cy=b.y+b.height*.5;
  gl.uniform2f(u.viewport,w,h);gl.uniform2f(u.bufferSize,canvas.width,canvas.height);gl.uniform2f(u.center,cx,cy);gl.uniform2f(u.halfExtent,button.offsetWidth/2,button.offsetHeight/2);gl.uniform1f(u.shear,shear);
  gl.uniform2f(u.contact,b.x+b.width*contact[0],b.y+b.height*contact[1]);gl.uniform1f(u.hold,hold);
  const age=(now-at)/1000,active=age>=0&&age<.82&&!reduced.matches;
  const ink=button.querySelector('strong'),textRect=ink.getBoundingClientRect();
  const reach=Math.hypot(b.width*Math.max(contact[0],1-contact[0]),1.22*b.height*Math.max(contact[1],1-contact[1]));
  const front=active?(1-Math.pow(1-age/.82,1.65))*(reach+42):1;
  ink.style.setProperty('--rx',Math.max(1,front)+'px');ink.style.setProperty('--ry',Math.max(1,front/1.22)+'px');
  ink.style.setProperty('--contact-x',(b.x+b.width*contact[0]-textRect.x)+'px');ink.style.setProperty('--contact-y',(b.y+b.height*contact[1]-textRect.y)+'px');
  ink.style.setProperty('--fringe',active?String(.85*(1-age/.82)):'0');ink.style.setProperty('--ink-x',reduced.matches?'0px':((contact[0]-.5)*3*hold)+'px');ink.style.setProperty('--ink-y',reduced.matches?'0px':(2.2*hold)+'px');
  gl.uniform1f(u.age,reduced.matches||age>1?-1:age);gl.uniform1f(u.evening,dusk?1:0);gl.drawArrays(gl.TRIANGLES,0,3);
  if(Math.abs(target-hold)>.001||Math.abs(speed)+Math.abs(flex)>.035||age<1)request();}
 function request(){if(!frame)frame=requestAnimationFrame(render);}
 function place(nx,ny){const w=main.clientWidth,h=main.clientHeight;x=Math.max(button.offsetWidth/(2*w),Math.min(1-button.offsetWidth/(2*w),nx));y=Math.max(button.offsetHeight/(2*h),Math.min(1-button.offsetHeight/(2*h),ny));request();}
 button.onpointerdown=e=>{if(e.button!==0||session!==null)return;const r=button.getBoundingClientRect();contact=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];cancelClick=false;session=e.pointerId;button.setPointerCapture(session);dx=x*main.clientWidth-e.clientX;dy=y*main.clientHeight-e.clientY;lastX=e.clientX;at=-Infinity;target=1;request();};
 button.onpointermove=e=>{if(pressDemo||session!==e.pointerId)return;speed=Math.max(-190,Math.min(190,speed-(e.clientX-lastX)*2));lastX=e.clientX;place((e.clientX+dx)/main.clientWidth,(e.clientY+dy)/main.clientHeight);};
 function end(e,cancel){if(session!==e.pointerId)return;session=null;target=0;const rect=button.getBoundingClientRect();cancelClick=cancel||e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom;if(pressDemo&&!cancelClick)at=performance.now();request();}
 button.onpointerup=e=>end(e,false);button.onpointercancel=button.onlostpointercapture=e=>end(e,true);
 button.onkeydown=e=>{if(e.repeat&&['Enter',' '].includes(e.key)){e.preventDefault();return;}if(!pressDemo&&e.key.startsWith('Arrow')){e.preventDefault();place(x+({ArrowLeft:-.025,ArrowRight:.025}[e.key]||0),y+({ArrowUp:-.025,ArrowDown:.025}[e.key]||0));}
 if(pressDemo&&['Enter',' '].includes(e.key)&&!e.repeat){contact=[.5,.5];target=1;at=-Infinity;request();}};
 button.onkeyup=e=>{if(pressDemo&&['Enter',' '].includes(e.key)){at=performance.now();target=0;request();}};
 button.onblur=()=>{target=0;request();};
 button.onclick=e=>{if(e.detail&&cancelClick)return;if(pressDemo){dusk=!dusk;button.setAttribute('aria-pressed',String(dusk));button.querySelector('span').textContent=dusk?'Dusk':'Daylight';if(e.detail===0&&target===0)at=performance.now();request();}};
 new ResizeObserver(request).observe(main);request();
}else{main.style.backgroundImage='url('+seascape().toDataURL()+')';main.style.backgroundSize='cover';button.style.background='#314d52aa';button.disabled=true;}
</script></body></html>
