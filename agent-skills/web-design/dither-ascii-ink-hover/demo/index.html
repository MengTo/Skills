<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dither and ASCII Ink Hover · Folvra</title><link rel="stylesheet" href="assets/style.css"><style>@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style></head><body><main class="page engraved-edition" aria-label="Dither and ASCII Ink Hover"><div class="page-content"><p class="skill-line">Folvra · Dither and ASCII ink hover<span>DOM · CSS masks · JavaScript</span></p><div class="ink-spread"><div class="ink-copy"><p class="overline">// Studio notes</p><h2>Paper proofs</h2><p>Move over the illustration to see the proof marks emerge in beige ink.</p><button type="button" class="skill-control" aria-pressed="false" id="proof">Inspect ink</button></div><div class="testimonial-art"><div aria-label="Iona Vey examines pigment proofs beside a studio window." class="field-plates" role="img"><img alt="" class="field-room" loading="lazy" src="assets/field-studio.webp"/><img alt="" class="field-printer" loading="lazy" src="assets/field-printer.webp"/></div><div class="art-caption"><p class="overline">// Studio notes</p><h1 class="display" id="quote-heading">Field notes</h1></div></div></div></div></main><script>
const plate=document.querySelector('.testimonial-art'), inspect=document.querySelector('#proof'), ink=document.createElement('i');
ink.className='proof-ink';ink.setAttribute('aria-hidden','true');plate.append(ink);
const fine=matchMedia('(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference)');
let pinned=false;function render(x,y){plate.style.setProperty('--x',x+'%');plate.style.setProperty('--y',y+'%');plate.dataset.proof=''}
plate.addEventListener('pointermove',e=>{if(!fine.matches||e.pointerType==='touch'||pinned)return;let r=plate.getBoundingClientRect();render(100*(e.clientX-r.left)/r.width,100*(e.clientY-r.top)/r.height)});
plate.addEventListener('pointerleave',()=>{if(!pinned)delete plate.dataset.proof});
inspect.addEventListener('click',()=>{pinned=!pinned;inspect.setAttribute('aria-pressed',String(pinned));if(pinned)render(55,42);else delete plate.dataset.proof});
</script></body></html>
